services:
  hub:
    build:
      context: .
      args:
        - PAPER_ID
      dockerfile: Docker_hub.Dockerfile
    container_name: ${PAPER_ID}_hub
    env_file: .env
    environment:
      # Ensure in-container spyglass uses the Docker data dir, not the host path from .env
      - SPYGLASS_BASE_DIR=/home/jovyan/data
    ports:
      - "${SPYGLASS_HUB_PORT}:8888"
    volumes:
      - conda:/opt/conda
      - notebooks:/home/jovyan/notebooks
    depends_on:
      - db
    networks:
      - spyglass_network

  db:
    build:
      context: .
      args:
        - MYSQL_USER
        - MYSQL_HOST
        - MYSQL_ROOT_PASSWORD
        - MYSQL_ROOT_HOST
      dockerfile: Docker_db.Dockerfile
    container_name: ${PAPER_ID}_db
    env_file: .env
    ports:
      - "${SPYGLASS_DB_PORT}:3306"
    volumes:
      - ./config/mysqld.cnf:/etc/mysql/mysql.conf.d/mysqld.cnf
      - db_data:/var/lib/mysql
    networks:
      - spyglass_network
    restart:
      on-failure

networks:
  spyglass_network:
    name: spyglass_net

volumes: # Docker managed mappings.
  conda: # Saves time declaring env
    name: "${PAPER_ID}_conda"
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SPYGLASS_VOLUME_DIR}/conda
  notebooks: # Saves user notebook edits
    name: "${PAPER_ID}_notebooks"
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SPYGLASS_VOLUME_DIR}/notebooks
  db_data: # Allows persistent db data
    name: "${PAPER_ID}_db_data"
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SPYGLASS_VOLUME_DIR}/db_data
